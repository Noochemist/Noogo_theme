{{- /* features/mermaid.html — Mermaid 图表，客户端渲染。features.mermaid 开启时全站注入（置于 <head>）。
  Mermaid 由 esbuild (js.Build) 本地打包（替代 unpkg CDN），扫描页面上的 mermaid 代码块并渲染为 SVG。
  置于 <head> 而非 swup 容器内：SPA 换页注入的 HTML 中 <script> 不会执行，须首载常驻 +
  监听 theme:content-replaced，供 SPA (swup) 导航后对新内容再次渲染。 */}}
{{- $on := site.Params.features.mermaid | default false }}
{{- if $on }}
{{- $jsOpts := dict
  "minify" (cond hugo.IsDevelopment false true)
  "sourceMap" (cond hugo.IsDevelopment "linked" "none")
}}
{{- with resources.Get "js/vendor/mermaid-build.js" }}
  {{- with . | js.Build $jsOpts }}
    <script defer src="{{ .RelPermalink }}"></script>
  {{- end }}
{{- end }}
<script>
  (function () {
    var LANG = 'mermaid';
    // 从“highlight 代码块”里挑出 mermaid 源码块，替换为 mermaid 容器
    function renderAll() {
      if (!window.mermaid) return;
      document.querySelectorAll('.highlight[data-lang="' + LANG + '"] pre > code')
        .forEach(function (code) {
          var outer = code.closest('.highlight');
          if (!outer || outer.__rendered) return;
          var box = document.createElement('div');
          box.className = 'mermaid';
          box.textContent = code.textContent;
          outer.replaceWith(box);
          outer.__rendered = true;
          mermaid.initialize({ startOnLoad: false, securityLevel: 'loose' });
          mermaid.run({ nodes: [box] });
        });
    }
    // 首次及 SPA 内容替换后渲染
    document.addEventListener('DOMContentLoaded', function () { setTimeout(renderAll, 0); });
    document.addEventListener('theme:content-replaced', renderAll);
  })();
</script>
{{- end }}
