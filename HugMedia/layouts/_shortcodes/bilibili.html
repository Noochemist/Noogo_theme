{{- /* B站视频 shortcode：{{< bilibili "BV1xxx" >}} 或 {{< bilibili "BV1xxx" height="360" >}} */ -}}
<div class="embed embed-bilibili">
  <iframe
    src="https://player.bilibili.com/player.html?bvid={{ .Get 0 }}"
    width="100%"
    height="{{ .Get "height" | default 480 }}"
    scrolling="no"
    frameborder="0"
    allowfullscreen
    title="Bilibili video"></iframe>
</div>
