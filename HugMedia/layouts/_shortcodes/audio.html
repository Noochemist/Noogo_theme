{{/* 音频 shortcode：{{< audio "audio-url" >}} 或 {{< audio "url" "type" >}} */}}
<audio controls preload="none" style="width:100%">
  <source src="{{ .Get 0 }}" type="{{ with .Get 1 }}{{ . }}{{ else }}audio/mpeg{{ end }}">
  {{ i18n "browserNoAudio" | default "Your browser does not support the audio element." }}
</audio>
