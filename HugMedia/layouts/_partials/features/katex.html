{{- /* features/katex.html 数学公式 KaTeX，客户端渲染。features.math 开启时全站注入（置于 <head>）。
     SPA (swup) 换页只替换 #main-content 内的 HTML，容器内 <script>/<link> 不会生效，
     因此不能按页面 math 前件条件注入——必须首载即常驻，配合 theme:content-replaced 对换页内容重渲染。
     KaTeX 由 esbuild (js.Build) 本地打包，替代 unpkg CDN，摆脱跨境网络依赖。 */}}
{{- $mathOn := site.Params.features.math | default false }}
{{- if $mathOn }}
  {{- /* 本地 KaTeX 样式与字体（static/katex/），替代 unpkg CDN */}}
  <link rel="stylesheet" href="{{ "katex/katex.min.css" | relURL }}">
  {{- $jsOpts := dict
    "minify" (cond hugo.IsDevelopment false true)
    "sourceMap" (cond hugo.IsDevelopment "linked" "none")
  }}
  {{- with resources.Get "js/vendor/katex-build.js" }}
    {{- with . | js.Build $jsOpts }}
      <script defer src="{{ .RelPermalink }}"></script>
    {{- end }}
  {{- end }}
  <script>
    (function () {
      // 仅当 KaTeX 两个库都就绪后渲染；首次、以及 SPA (theme:content-replaced) 后再次渲染
      function renderMath() {
        if (!window.renderMathInElement || !window.katex) return;
        renderMathInElement(document.body, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '$', right: '$', display: false },
          ],
          throwOnError: false,
        });
      }
      document.addEventListener('DOMContentLoaded', function () { setTimeout(renderMath, 0); });
      document.addEventListener('theme:content-replaced', renderMath);
    })();
  </script>
{{- end }}
